[project]
name = "tech-explainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
explain = "tech_explainer.cli:main"


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
]
